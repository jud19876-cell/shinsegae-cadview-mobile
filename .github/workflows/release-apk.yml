name: Build & Release Signed APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Production Bundle
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ssgfe2026!' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'fecadkey' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ssgfe2026!' }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK for Direct Download Link
        run: |
          cp android/app/build/outputs/apk/release/*.apk shinsegae-cadview-mobile-latest.apk

      - name: Create GitHub Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: shinsegae-cadview-mobile-latest.apk
          name: ${{ github.ref_name }}
          generate_release_notes: true
